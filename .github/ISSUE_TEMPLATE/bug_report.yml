name: Bug report
description: Something in snippet does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems should not be filed here. See SECURITY.md for how to report them privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Daemon or CLI version (`snippet --version`) and operating system.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Logs or a transcript excerpt. Remove API keys, tokens and personal data.
