[package]
name = "snippet"
version = "1.0.0-alpha.17"
edition = "2024"
description = "A Rust TUI coding agent with a headless, remote-controllable serve daemon."
license = "AGPL-3.0-or-later"
repository = "https://github.com/wacht-platform/snippet-service"
readme = "README.md"
keywords = ["agent", "tui", "coding", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
qrcode = "0.14"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
daemonize = "0.5"
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
flate2 = "1.0"
tar = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
urlencoding = "2"
rmp-serde = "1.3"
ignore = "0.4"
libc = "0.2.189"
vt100 = "0.15.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Linux loads Microsoft's onnxruntime .so at runtime (fetched on first use) so the binary gains no libstdc++ dependency.
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
libloading = "0.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }

[dev-dependencies]
tempfile = "3"
